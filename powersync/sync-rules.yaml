# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

config:
  edition: 3

streams:
  t3code_global:
    auto_subscribe: true
    queries:
      - |
        SELECT
          project_id AS id,
          project_id,
          title,
          workspace_root,
          scripts_json,
          created_at,
          updated_at,
          deleted_at,
          default_model_selection_json
        FROM projection_projects
      - |
        SELECT
          thread_id AS id,
          thread_id,
          project_id,
          title,
          branch,
          worktree_path,
          latest_turn_id,
          created_at,
          updated_at,
          deleted_at,
          runtime_mode,
          interaction_mode,
          model_selection_json,
          archived_at,
          latest_user_message_at,
          pending_approval_count,
          pending_user_input_count,
          has_actionable_proposed_plan
        FROM projection_threads
      - |
        SELECT
          message_id AS id,
          message_id,
          thread_id,
          turn_id,
          role,
          text,
          is_streaming,
          created_at,
          updated_at,
          attachments_json
        FROM projection_thread_messages
      - |
        SELECT
          activity_id AS id,
          activity_id,
          thread_id,
          turn_id,
          tone,
          kind,
          summary,
          payload_json,
          created_at,
          sequence
        FROM projection_thread_activities
      - |
        SELECT
          thread_id AS id,
          thread_id,
          status,
          provider_name,
          provider_session_id,
          provider_thread_id,
          active_turn_id,
          last_error,
          updated_at,
          runtime_mode,
          provider_instance_id
        FROM projection_thread_sessions
      - |
        SELECT
          row_id::text AS id,
          row_id,
          thread_id,
          turn_id,
          pending_message_id,
          assistant_message_id,
          state,
          requested_at,
          started_at,
          completed_at,
          checkpoint_turn_count,
          checkpoint_ref,
          checkpoint_status,
          checkpoint_files_json,
          source_proposed_plan_thread_id,
          source_proposed_plan_id
        FROM projection_turns
      - |
        SELECT
          request_id AS id,
          request_id,
          thread_id,
          turn_id,
          status,
          decision,
          created_at,
          resolved_at
        FROM projection_pending_approvals
      - |
        SELECT
          projector AS id,
          projector,
          last_applied_sequence,
          updated_at
        FROM projection_state
      - |
        SELECT
          plan_id AS id,
          plan_id,
          thread_id,
          turn_id,
          plan_markdown,
          created_at,
          updated_at,
          implemented_at,
          implementation_thread_id
        FROM projection_thread_proposed_plans
      - |
        SELECT
          id,
          command_id,
          session_id,
          command_json,
          status,
          result_sequence,
          error,
          created_at,
          updated_at
        FROM client_orchestration_commands
