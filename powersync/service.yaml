# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: sync-rules.yaml

client_auth:
  jwks_uri: !env PS_JWKS_URL
  audience: ["powersync", "t3code-powersync"]

api:
  tokens:
    - !env PS_API_TOKEN

system:
  logging:
    level: info
    format: text
